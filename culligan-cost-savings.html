ecommended sequence — three waves","lead":"The savings opportunities are interdependent. The recommended sequence maximises early wins while building the governance foundation required for the larger structural changes. Nothing in Waves 2 or 3 is achievable without the governance investment in Wave 1.","waves":[{"wave":"Wave 1","horizon":"0–6 months (Foundation)","actions":"Formalise Group CIO cross-BU mandate. Establish IT architecture board. Commission TBM baseline (PwC H4). Complete SaaS and telecom vendor audit (H5 quick wins). Renegotiate top 5 MSP contracts as a group.","saving":"$4–10M (vendor renegotiation + SaaS audit). Primarily H5."},{"wave":"Wave 2","horizon":"6–18 months (Consolidation)","actions":"Select and deploy group ITSM platform (ServiceNow). Migrate first 5 BU service desks. Standardise L1/L2 triage processes. Launch corporate Salesforce roll-out to first 3 BUs. Begin IFS ERP pilot (2 BUs).","saving":"$6–14M (service desk + CRM). Primarily H4 + H3."},{"wave":"Wave 3","horizon":"18–36 months (Transformation)","actions":"Complete service desk consolidation (all BUs on group model). Accelerate IFS ERP roll-out. Consolidate cloud tenancies under group FinOps. Design and implement group IT chargeback model. Full headcount right-sizing.","saving":"$12–20M additional. H3 + H2 + H4 headcount savings."}],"governanceTitle":"Governance — the enabling investment","governanceLead":"None of the above savings are achievable without first establishing the governance structures that make consolidation possible. Three investments are non-negotiable:","governance":[{"investment":"Group CIO mandate extension","does":"The Group CIO exists but currently manages Corporate enterprise agreements only. The mandate must be extended to cover all BU-level technology decisions — platform standards, architecture, vendor contracts.","without":"The Group CIO has no authority to enforce group standards at BU level. Every consolidation initiative requires BU-by-BU negotiation."},{"investment":"Group IT architecture board","does":"Quarterly governance body (Group CIO chair, BU IT leads) to ratify technology decisions and manage the application consolidation roadmap.","without":"No mechanism to enforce the IFS ERP template, Salesforce consolidation, or ITSM standardisation."},{"investment":"Group IT chargeback model","does":"BUs on group platforms pay the consolidated rate; BUs operating outside group standards pay the full undiscounted cost. Gives the Group CIO commercial leverage.","without":"No financial incentive for BUs to move to group platforms. Fragmentation continues to grow."}]}},"taxonomyNavLinks":[{"id":"taxonomy-overview","label":"Overview"},{"id":"taxonomy-executive","label":"Executive summary"},{"id":"taxonomy-capabilities","label":"Capability model"},{"id":"taxonomy-current-state","label":"Current state"},{"id":"taxonomy-future-state","label":"Future state"},{"id":"taxonomy-leadership","label":"IT leadership"},{"id":"taxonomy-benchmark","label":"Benchmarks"},{"id":"taxonomy-savings","label":"Savings case"},{"id":"taxonomy-roadmap","label":"Roadmap"},{"id":"taxonomy-regions","label":"Regional spend"}],"operatingRegions":[{"id":"americas","name":"Americas","vendorSpend":"$774.8M","itSpend":"$14.98M","itPercent":"1.9%","costExplanation":"Americas IT totals $15.0M across 5 BUs in the spend cube (1–3% of vendor spend). Quench and Flagship drive IT spend; ZeroWater, Paragon, and Brazil are under-invested in operational IT.","businessUnits":["Culligan Quench","Flagship","Franchise & dealers","OEM channel","NA Consumer Products","Latin America"]},{"id":"emea","name":"EMEA","vendorSpend":"$476.0M","itSpend":"$22.21M","itPercent":"4.7%","costExplanation":"EMEA IT totals $22.2M across 6 BUs. Iberia, Germany, Nordics, and UK CDW at 6% reflect fragmented MSP and local service desk models. Poland at 1% is the highest H4 standardisation opportunity.","businessUnits":["France & Switzerland","Iberia","Germany","Poland & Baltics","Nordics","UK CDW"]},{"id":"apac","name":"APAC","vendorSpend":"$234.7M","itSpend":"$8.11M","itPercent":"3.5%","costExplanation":"APAC IT totals $8.1M across 3 BUs in the spend cube. ZIP ANZ carries group ERP migration cost; Harvey and ZIP UK rely on lean local IT stacks.","businessUnits":["ZIP ANZ","ZIP UK","Culligan AUS","China","Southeast Asia"]}],"agentDestinations":[{"id":"overview","label":"Overview","page":"benchmark","aliases":["overview","overview","overview"]},{"id":"priority","label":"CIO priorities","page":"benchmark","aliases":["cio priorities","priority","priority"]},{"id":"findings","label":"Key findings","page":"benchmark","aliases":["key findings","findings","findings"]},{"id":"value","label":"Savings & EBITDA","page":"benchmark","aliases":["savings & ebitda","value","value"]},{"id":"insights","label":"Strategic insights","page":"benchmark","aliases":["strategic insights","insights","insights"]},{"id":"roadmap","label":"Roadmap","page":"benchmark","aliases":["roadmap","roadmap","roadmap"]},{"id":"reference","label":"Benchmark data","page":"benchmark","aliases":["benchmark data","reference","reference"]},{"id":"taxonomy-overview","label":"Overview","page":"taxonomy","aliases":["overview","taxonomy-overview","overview"]},{"id":"taxonomy-executive","label":"Executive summary","page":"taxonomy","aliases":["executive summary","taxonomy-executive","executive"]},{"id":"taxonomy-capabilities","label":"Capability model","page":"taxonomy","aliases":["capability model","taxonomy-capabilities","capabilities"]},{"id":"taxonomy-current-state","label":"Current state","page":"taxonomy","aliases":["current state","taxonomy-current-state","current state"]},{"id":"taxonomy-future-state","label":"Future state","page":"taxonomy","aliases":["future state","taxonomy-future-state","future state"]},{"id":"taxonomy-leadership","label":"IT leadership","page":"taxonomy","aliases":["it leadership","taxonomy-leadership","leadership"]},{"id":"taxonomy-benchmark","label":"Benchmarks","page":"taxonomy","aliases":["benchmarks","taxonomy-benchmark","benchmark"]},{"id":"taxonomy-savings","label":"Savings case","page":"taxonomy","aliases":["savings case","taxonomy-savings","savings"]},{"id":"taxonomy-roadmap","label":"Roadmap","page":"taxonomy","aliases":["roadmap","taxonomy-roadmap","roadmap"]},{"id":"taxonomy-regions","label":"Regional spend","page":"taxonomy","aliases":["regional spend","taxonomy-regions","regions"]},{"id":"findings","label":"Key findings","page":"benchmark","aliases":["findings","hypothesis","h1","h2","h3","h4","h5","h6"]},{"id":"priority","label":"CIO priorities","page":"benchmark","aliases":["cio","priorities","top 3"]},{"id":"taxonomy-leadership","label":"IT leadership","page":"taxonomy","aliases":["leadership","cio structure","design options"]},{"id":"taxonomy-savings","label":"Savings case","page":"taxonomy","aliases":["savings case","savings levers"]},{"id":"taxonomy-regions","label":"Regional spend","page":"taxonomy","aliases":["regions","regional spend","americas","emea","apac"]}],"searchSnippets":[{"title":"Savings opportunity","content":"Culligan is not an IT overspender — it is an IT mis-spender. Vendor spend sits within benchmark, but ~3× peer software costs, 25+ fragmented ERP systems, and ungoverned BU purchasing leave $16–31M in confirmed annual savings on the table. This report quantifies the opportunity and sequences the CIO actions to capture it. The $16–31M confirmed savings range represents $160–370M in enterprise value at current multiples — before the SaaS waste upside is validated. Put differently: the IT transformation program, if executed successfully, is worth more to Culligan's equity value than the average acquisition in the current bolt-on pipeline. This is the single most important reframe for any board or ownership conversation about IT investment."},{"title":"CIO priorities","content":"Launch the SAM Program $4.2–10.4M yr-1 A Software Asset Management (SAM) program is the discipline of knowing exactly what software Culligan owns, who is using it, and whether the company is getting value for money across every contract.\n\nRight now, no single team knows what software is installed across 40+ acquired companies, how many seats are paid for versus actually used, or whether the same tool has been bought ten times under different contracts. A SAM program fixes this by creating a single inventory of all software contracts, identifying unused licences (industry average: 51% go unused), consolidating duplicate tools, and renegotiating vendor agreements using Culligan's full scale as leverage — instead of negotiating as 40 separate companies. This is not an IT project. It is a procurement and governance exercise that pays back faster than almost any other IT initiative available. Scale the AI Service Desk — 40,000 Tickets Off the Queue, Starting Now $1.1–1.3M year-one · $4.7–7.9M fully scaled undefined Standardise Developer Tools — $1–2M in Productivity Sitting Unused Across the Engineering Team $1.0–2.0M annually undefined"},{"title":"Vendor and software","content":"Culligan is spending nearly three times what comparable companies spend on software. Half the entire IT budget goes to vendor contracts that nobody centrally manages. The company is almost certainly paying for licences nobody uses, multiple tools that do the same job in different regions, and prices that could be dramatically lower if negotiated as one company."},{"title":"Operating model fragmentation","content":"Culligan's IT operating model is not a model. It is 24 separate IT operations running in parallel, each replicating the same capabilities independently. The cost of that duplication is measurable. The path to reducing it is clear. Culligan's IT estate is the unmanaged residue of 20+ acquisitions. Every business unit runs its own IT operation independently — its own ERP, CRM, service desk, managed service contracts, and IT staff — with no group mandate to standardise, consolidate, or govern. Culligan operates one business model across three regions, but runs its IT 24 separate ways."},{"title":"Future state","content":"The target model consolidates all 24 BUs onto shared group platforms, governed by a Group CIO and IT architecture board, with BU-level configuration rather than BU-level infrastructure. The structural change delivers $22–44M in annual run-rate savings at Year 3. Group CIO. IT architecture board. BU-level config within group standards. 1 group IFS template. BU-level configuration. 1 Salesforce EA (already negotiated — $7.2M). 19 BUs migrated onto it. 1 group ServiceNow. $12–20/ticket (best-in-class). Consolidated cloud org. Group FinOps. Volume pricing. Group shared services. 20–30 consolidated roles. $6–10M saving. Group framework agreements for SaaS, telecom, hardware."},{"title":"Roadmap","content":"PHASE 1: Quick Wins Launch SAM + vendor rationalization program across all 44+ contracts Appoint SAM program lead; establish vendor governance council Commission IT labor survey (60 days) to size H2 delayering Close BU coverage gap: Italy (9 entities), Canada, CWC, China, EMEA OEM Validate TBM tower mapping in CIO office workshops Deploy AI-driven SAM tooling to accelerate license waste recovery PHASE 2: Structural Reform Execute org delayering — reduce management ratio from 19.9% to ~12–13% Build and launch global IT shared-services model for end-user support Scale Moveworks/ServiceNow Now Assist to 30–45% L1 ticket deflection Standardize developer copilots (GitHub Copilot/Cursor) across dev population Implement FinOps program to recover 28–35% cloud waste Build and deploy M&A IT integration playbook (5-phase) Unify ITSM toolchain across all 4 regions onto single platform Define and enforce offshore delivery strategy — target 25–35% mix PHASE 3: Transformation Anchor Complete application portfolio inventory and ERP consolidation business case Select common ERP platform; define phased migration by BU cluster Begin Year-1 ERP migrations (North America recommended as first cluster) Retire duplicate and low-value applications — target 20–30% app rationalization Implement Architecture Governance Council — enforce global standards post-delayering Deploy AIOps for incident reduction and back-office automation Set and govern IT investment mix target: 65% Run / 20% Grow / 15% Transform"},{"title":"IT leadership","content":"Wave 1 requires a decision on IT leadership structure before governance can be formalised. The matrix below shows who owns each IT function under today's fragmented model versus three design options — and why each assignment matters for the savings case. Group CIO owns strategy, shared services, vendor agreements, and cybersecurity. EMEA CIO covers regional delivery, demand management, and compliance; Americas and APAC use IT Directors. BU liaisons consume group platforms rather than operating independent stacks."},{"title":"Cost of inaction","content":"The conservative annual cost of inaction — $22–35M/year — is larger than the confirmed annual savings opportunity of $16–31M. Every year of delay costs more than the transformation saves in year one. The question is not whether Culligan can afford to invest in IT transformation. It is whether it can afford not to."},{"title":"Maturity model","content":"Culligan scores 1–2 across six of seven domains — including the two most critical (Vendor Governance and M&A IT Integration). No domain scores above 3. The target is reaching 3–4 across the board — the threshold at which IT stops being a growth constraint and starts being a growth enabler."},{"title":"Software & Licensing: 3× Median Is a Governance Failure, Not a Spending Problem","content":"Software spend is $34.8M — 1.05% of revenue vs. 0.36% peer median (~3×), representing 50% of all IT spend. 44 vendor contracts identified so far, none centrally governed. Industry data (Zylo 2026): 51% of enterprise SaaS licenses go unused. Applied to Culligan's $34.8M base, $8–18M may be directly recoverable through governance alone. The 3× median is the mathematical output of 300 acquisitions with no vendor governance. Every new acquisition adds contracts. Half of Culligan's IT budget is funding vendor margin on software nobody centrally manages. At 50 acquisitions per year, this gets worse every quarter without intervention. Launch a SAM + vendor rationalization program immediately. Step 1: full license audit across all 44+ contracts. Step 2: consolidate overlapping tools. Step 3: renegotiate top-10 vendor EAs using group-wide volume leverage. Target $4.2–10.4M year-one savings. Establish a Vendor Governance Council chaired by the CIO."},{"title":"Org Structure: The Root Cause That Makes Every Other Problem Unfixable","content":"56 of 281 IT FTEs (19.9%) hold management roles — 81% above the lean ~11% norm. 85 FTEs/$1B vs. 70.5 median. Each regional M&A wave added leadership layers never consolidated. The H2 dollar value is unquantified pending the IT labor survey. Too many managers — each empowered to make local tool, vendor, and ERP choices — is the structural cause of the 3× software median, the 25+ ERP estate, and the four duplicated support models. Fix the vendors without fixing the org and the same incentives recreate the fragmentation within 3–5 years. Commission the IT labor survey within 30 days. Design a global IT operating model with unified Architecture Governance reporting to the CIO. Target management ratio of 12–13%. Implement global vendor and technology approval gates."},{"title":"ERP Fragmentation: 25 Systems Is an M&A Integration Tax on Every Future Deal","content":"Application tower is $25.1M — 36% of IT, 0.76% revenue vs. 0.65% median. 25+ ERPs across 40 BUs (SAP, IFS, Sage, NetSuite, D365, TOTVS). Forrester TEI: ERP consolidation delivers 106% ROI over 3 years for manufacturing, with 17-month payback. 25+ ERPs means consolidated P&L, supply chain optimization, and customer reporting are structurally impossible. Each new acquisition adds another system. Culligan's ownership cannot get a clean view of the business — the opposite of a scalable M&A machine. Begin ERP consolidation business case immediately. 90-day actions: application portfolio inventory, evaluate platform options, define first-migration BU cluster (North America recommended). Set architectural freeze: no new ERP variants without Architecture Council exception."},{"title":"M&A IT Integration: No Playbook at 50 Deals/Year Is a Material Value Leak","content":"Culligan executes ~50 bolt-on acquisitions per year with no standardized IT integration playbook. Industry research consistently shows IT integration costs run 5–15% of deal value; up to 60% of M&A synergy initiatives are IT-related but delayed by fragmentation; 70–75% of M&A deals underperform, with IT complexity a leading cause. At $2–4M revenue per acquisition, IT integration costs of 5–15% imply $100–600K per deal — at 50 deals/year, $5–30M in annual integration overhead producing the ERP variants and software contracts that cost $34.8M to maintain. Every acquisition without standards is a future cost that must eventually be rationalized. Build a standardized 5-phase M&A IT integration playbook within 90 days. Apply to all future acquisitions immediately. Include: IT due diligence checklist, Day-1 readiness, 90-day integration tasks, ERP classification framework, and vendor contract absorption process."},{"title":"IT Support Operating Model: Linear Scaling Is a Growth Tax","content":"End-user support is $13.0M — 19% of IT — through four independent regional organizations (EMEA 144 / NA 86 / LATAM 39 / APAC 12 FTEs). ~126K annual tickets handled largely manually. HDI/MetricNet 2026: median cost per ticket is $22. Every acquisition adds support FTEs in proportion to users. At 50 acquisitions per year, support cost compounds continuously. At $22/ticket × 126K tickets = $2.8M addressable annual support cost on the current base alone. Design global shared-services operating model as part of Phase 2 org reform. Scale Moveworks/ServiceNow Now Assist to 30–45% L1 deflection — ~$1.1–1.3M recoverable. Unify ITSM on single platform. Target: $2.0–3.9M savings."},{"title":"Infrastructure Is a Discipline to Export, Not an Area to Fix","content":"Network at 0.12% of revenue — below 0.17% peer median. Total infrastructure $5.6M — lean and efficient. Mature Moveworks/ServiceNow deployments achieve 45–65% containment — Culligan's 30–45% year-one target is conservative. Infrastructure discipline proves the organization can run lean when governance is applied. The same rigor needs to be applied to software and application management. The $4.7–7.9M H1 range may have further upside at mature containment rates. Protect infrastructure investment discipline — do not reopen this cost base. Scale Moveworks/ServiceNow Now Assist to production. Standardize developer copilots. Pilot AIOps. Use infrastructure governance as the template for vendor and application estates."},{"title":"H6 — Vendor & Licensing","content":"$34.8M software spend = 1.05% of revenue\nPeer median: 0.36% of revenue\nCulligan is 3× above benchmark\n44+ vendor contracts identified\nSoftware = 50% of total IT budget Culligan is spending nearly three times what comparable companies spend on software. Half the entire IT budget goes to vendor contracts that nobody centrally manages. The company is almost certainly paying for licences nobody uses, multiple tools that do the same job in different regions, and prices that could be dramatically lower if negotiated as one company."},{"title":"H2 — Spans & Layers","content":"56 of 281 IT staff are managers = 19.9%\nIndustry lean norm: ~11%\nCulligan is 81% above norm\n85 IT staff per $1B revenue\nPeer median: 70.5 per $1B (+21%) Nearly 1 in 5 IT employees is a manager — almost double the industry norm. Each manager has the authority to buy their own software tools and keep their own ERP system. The management structure is the direct cause of the software and ERP fragmentation visible in every other finding."},{"title":"H4 — Application & Platform","content":"$25.1M application spend = 0.76% of revenue\nPeer median: 0.65% of revenue\n25+ ERP systems across 40 business units\nSAP, IFS, Sage, NetSuite, D365, TOTVS — all active\nLargest single cost tower: 36% of IT spend Culligan has 25+ different financial systems, each acquired through M&A and never consolidated. Every company-wide P&L requires manual gathering from 25 different systems. Leadership cannot get a reliable, real-time view of the business. Every new acquisition makes this worse."},{"title":"H5 — IT Support & Op Model","content":"$13.0M end-user support = 19% of IT\nEMEA: 144 support staff · NA: 86 · LATAM: 39 · APAC: 12\n~126,000 IT support tickets per year IT support is delivered by four completely separate regional teams. When Culligan acquires a new company, it adds IT support staff in proportion to users rather than absorbing them into an existing pool. Support costs grow at the same rate as acquisitions — roughly 50 new companies a year."},{"title":"H3 — Infrastructure & Cloud","content":"Network spend: 0.12% of revenue\nPeer median: 0.17% of revenue\nTotal infrastructure: $5.6M\nBelow benchmark across all metrics\nFinOps programme: not yet implemented Infrastructure is the one area where Culligan is genuinely doing better than peers — spending less and running lean. This should be protected. The only gap is cloud spending is not actively optimised (FinOps), which typically recovers 28–35% of cloud costs in year one."},{"title":"H1 — AI & Automation","content":"~126,000 IT support tickets per year\nEstimated cost per ticket: ~$22\nAI deflection rate today: ~0%\nMature deployments achieve: 45–65%\nMoveworks deployed — early stage only Culligan already has Moveworks (now ServiceNow) to handle routine IT requests — but it has barely been switched on. At 126,000 tickets and $22 per ticket, deploying AI properly could automatically handle 40–50% of requests, saving $1–1.5M annually without buying new technology."},{"title":"Overall IT Spend","content":"Total IT & Digital spend: $69.2M\nCulligan as % of revenue: 2.10%\nPeer median: 2.44% of revenue\nCovers 20 of 40 business units\nEstimated full baseline: $110–130M At a headline level, Culligan spends less on IT than comparable companies. However this headline is misleading: the opportunity exists because Culligan mis-spends within that total. Too much goes to ungoverned software and too little to structural investments that would make the whole estate more efficient."}],"agentWelcome":"Hi — I'm here to explain this report in plain English.\n\nYou can ask about savings, CIO priorities, regional IT spend, or say things like \"take me to the roadmap\" and I'll scroll you there.\n\nPick a suggested question below, or type your own.","suggestedPrompts":[{"label":"Top 3 CIO priorities","message":"In simple terms, what are the three most important things the CIO should do first?"},{"label":"Vendor spend findings","message":"Explain the vendor and software licensing findings in plain English"},{"label":"Savings opportunity","message":"How much could Culligan save, and where does the money come from?"},{"label":"EMEA IT spend","message":"How much does EMEA spend on IT, and what does that mean?"},{"label":"IT leadership","message":"What is the recommended IT leadership structure, explained simply?"},{"label":"Future state","message":"Take me to the future state section and summarise it simply"}]};

function renderFindingsTable(){
  const rows=[...appData.keyFindings.findingsTable.rows].sort((a,b)=>{
    let av=a[sortCol]??a.area,bv=b[sortCol]??b.area;
    if(av<bv)return sortAsc?-1:1;if(av>bv)return sortAsc?1:-1;return 0;
  });
  const el=document.getElementById("findingsBody");
  if(!el)return;
  el.innerHTML=rows.map(r=>'<tr><td><strong>'+esc(r.code)+'</strong></td><td>'+esc(r.area)+'</td><td>'+badge(r.statusType,r.status)+'</td><td>'+nl(r.numbers)+'</td><td>'+esc(r.meaning)+'</td></tr>').join("");
}

function bindSort(){
  document.querySelectorAll("#findingsTable th[data-col]").forEach(th=>{
    th.onclick=()=>{const c=th.dataset.col;if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=true;}renderFindingsTable();};
  });
}

function drawChart(){
  const canvas=document.getElementById("savingsChart");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=rect.width,H=rect.height,data=appData.ebitdaImpact.chartData;
  const maxVal=Math.max(...data.map(x=>x.high))*1.12;
  const padL=100,padR=24,padT=16,padB=28;
  const gap=(H-padT-padB)/data.length,barH=gap*0.5;
  ctx.clearRect(0,0,W,H);
  data.forEach((d,i)=>{
    const y=padT+i*gap+(gap-barH)/2;
    const xLow=padL+(d.low/maxVal)*(W-padL-padR);
    const xHigh=padL+(d.high/maxVal)*(W-padL-padR);
    ctx.fillStyle="#022656";ctx.fillRect(padL,y,xLow-padL,barH);
    ctx.fillStyle="#1b7f9e";ctx.fillRect(xLow,y,xHigh-xLow,barH);
    ctx.fillStyle="#1a1a2e";ctx.font="11px system-ui,sans-serif";ctx.textAlign="right";
    ctx.fillText(d.name,padL-8,y+barH/2+4);
    ctx.textAlign="left";ctx.fillStyle="#5a6a7e";
    ctx.fillText("$"+d.low+"–"+d.high+"M",xHigh+6,y+barH/2+4);
  });
  ctx.fillStyle="#5a6a7e";ctx.font="10px system-ui";ctx.textAlign="center";
  ctx.fillText("Estimated annual savings ($M) — navy = low, teal = high range",W/2,H-6);
}

/* Client-side agent for culligan-cost-savings.html — expects global appData */

const AGENT_DISCLAIMER =
  "Note: All figures are draft estimates for internal review only. Do not use for board or external reporting without CIO sign-off.";

function stripMd(text) {
  if (!text) return "";
  return String(text)
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
}

function firstSentence(text, max = 280) {
  const clean = stripMd(text);
  if (clean.length <= max) return clean;
  const cut = clean.slice(0, max);
  const dot = cut.lastIndexOf(".");
  return dot > 80 ? cut.slice(0, dot + 1) : cut.trim() + "…";
}

function explainHypothesis(code) {
  const names = {
    H1: "AI and automation",
    H2: "spans, layers, and IT organisation structure",
    H3: "infrastructure and cloud",
    H4: "applications, ERP, and platforms",
    H5: "IT support and the operating model",
    H6: "vendor management and software licensing",
  };
  return names[code] || "this area of IT spending";
}

function matchDestination(query) {
  const q = query.toLowerCase().trim();
  if (!q) return null;
  let best = null;
  let bestScore = 0;
  for (const dest of appData.agentDestinations) {
    for (const alias of dest.aliases) {
      if (q.includes(alias) || alias.includes(q)) {
        const score = alias.length;
        if (score > bestScore) {
          bestScore = score;
          best = dest;
        }
      }
    }
    if (q.includes(dest.label.toLowerCase())) {
      const score = dest.label.length + 10;
      if (score > bestScore) {
        bestScore = score;
        best = dest;
      }
    }
  }
  return best;
}

function navigateTo(dest) {
  if (!dest) return false;
  const page = dest.page === "taxonomy" ? "taxonomy" : "benchmark";
  if (typeof setPage === "function") setPage(page);
  setTimeout(() => {
    if (typeof scrollToId === "function") scrollToId(dest.id);
  }, page !== currentPage ? 350 : 50);
  return true;
}

function searchKnowledge(query, limit = 4) {
  const q = query.toLowerCase();
  const words = q.split(/\s+/).filter((w) => w.length > 2);
  const scored = appData.searchSnippets
    .map((s) => {
      const hay = (s.title + " " + s.content).toLowerCase();
      let score = 0;
      for (const w of words) {
        if (hay.includes(w)) score += w.length;
      }
      if (hay.includes(q)) score += q.length * 2;
      return { ...s, score };
    })
    .filter((s) => s.score > 0)
    .sort((a, b) => b.score - a.score);
  return scored.slice(0, limit);
}

function planAgentSteps(message) {
  const m = message.toLowerCase().trim();
  const steps = [];
  const NAV_RE = /\b(go to|show me|take me|navigate|open|jump to|scroll to)\b/i;
  const CIO_RE = /\b(cio priorit|top 3|three things|do nothing|most important)\b/i;
  const LEADERSHIP_RE = /\b(leadership|cio structure|regional cio|it director|design option)\b/i;
  const SAVINGS_RE = /\b(savings|save|how much|ebitda|enterprise value|money come from)\b/i;
  const ROADMAP_RE = /\b(roadmap|phase|wave|implementation plan)\b/i;
  const LIST_RE = /\b(what sections|what pages|where can i|list sections|what can you)\b/i;
  const VENDOR_RE = /\b(vendor|software|licen|sam|h6)\b/i;
  const FUTURE_RE = /\b(future state|consolidat|target model)\b/i;
  const HYPOTHESIS_RE = /\bh\s*([1-6])\b/i;
  const REGION_RE = /\b(americas|emea|apac)\b/i;

  if (LIST_RE.test(m)) {
    steps.push({ tool: "list_sections", args: {} });
    return steps;
  }

  if (CIO_RE.test(m)) {
    steps.push({ tool: "get_cio_priorities", args: {} });
    if (NAV_RE.test(m)) steps.push({ tool: "navigate", args: { section: "CIO priorities" } });
    return steps;
  }

  if (LEADERSHIP_RE.test(m)) {
    steps.push({ tool: "get_leadership_options", args: { recommended_only: /\brecommend/i.test(m) } });
    if (NAV_RE.test(m) || /\boption|design\b/i.test(m)) {
      steps.push({ tool: "navigate", args: { section: "IT leadership" } });
    }
    return steps;
  }

  if (FUTURE_RE.test(m)) {
    steps.push({ tool: "get_future_state", args: {} });
    if (NAV_RE.test(m)) steps.push({ tool: "navigate", args: { section: "Future state" } });
    return steps;
  }

  if (SAVINGS_RE.test(m) && !HYPOTHESIS_RE.test(m)) {
    steps.push({ tool: "get_savings_summary", args: {} });
    if (NAV_RE.test(m)) steps.push({ tool: "navigate", args: { section: "Savings & EBITDA" } });
    return steps;
  }

  if (ROADMAP_RE.test(m)) {
    steps.push({ tool: "get_roadmap", args: {} });
    if (NAV_RE.test(m)) steps.push({ tool: "navigate", args: { section: "Roadmap" } });
    return steps;
  }

  if (VENDOR_RE.test(m) && !HYPOTHESIS_RE.test(m)) {
    steps.push({ tool: "get_hypothesis", args: { code: "H6" } });
    return steps;
  }

  const hypMatch = m.match(HYPOTHESIS_RE);
  if (hypMatch) {
    steps.push({ tool: "get_hypothesis", args: { code: "H" + hypMatch[1] } });
    if (NAV_RE.test(m)) steps.push({ tool: "navigate", args: { section: "H" + hypMatch[1] } });
    return steps;
  }

  const regionMatch = m.match(REGION_RE);
  if (regionMatch && /\b(spend|it|cost|region|vendor)\b/i.test(m)) {
    const region = { americas: "Americas", emea: "EMEA", apac: "APAC" }[regionMatch[1]];
    steps.push({ tool: "get_region_spend", args: { region } });
    if (NAV_RE.test(m)) steps.push({ tool: "navigate", args: { section: "Regional spend" } });
    return steps;
  }

  if (NAV_RE.test(m)) {
    const dest = matchDestination(m);
    if (dest) {
      steps.push({ tool: "navigate", args: { section: dest.label } });
      return steps;
    }
  }

  if (/\b(operating model|24 bu|fragment)\b/i.test(m)) {
    steps.push({ tool: "get_operating_model_summary", args: {} });
    return steps;
  }

  if (/\b(maturity|score)\b/i.test(m)) {
    steps.push({ tool: "get_maturity", args: {} });
    return steps;
  }

  steps.push({ tool: "search", args: { query: message } });
  return steps;
}

function executeTool(name, args) {
  const d = appData;

  switch (name) {
    case "navigate": {
      const dest = matchDestination(args.section || "") || d.agentDestinations.find((x) => x.id === args.section);
      if (!dest) {
        return {
          ok: false,
          error: 'I could not find that section. Try "CIO priorities", "roadmap", "future state", or "regional spend".',
        };
      }
      navigateTo(dest);
      return { ok: true, action: "navigate", destination: dest };
    }

    case "search": {
      const results = searchKnowledge(args.query || "", 4);
      return { ok: true, action: "search", query: args.query, results };
    }

    case "get_hypothesis": {
      const code = (args.code || "").toUpperCase().replace(/^H?/, "H");
      const normalized = code.startsWith("H") ? code : "H" + code;
      const legend = d.keyFindings.hypothesisLegend.rows.find((r) => r.code === normalized);
      const finding = d.keyFindings.findingsTable.rows.find((r) => r.code === normalized);
      if (!legend) return { ok: false, error: "Unknown hypothesis — try H1 through H6." };
      return { ok: true, action: "get_hypothesis", code: normalized, legend, finding };
    }

    case "get_region_spend": {
      const regionName = args.region;
      const region = d.operatingRegions.find((r) => r.name === regionName);
      if (!region) return { ok: false, error: "Region must be Americas, EMEA, or APAC." };
      return { ok: true, action: "get_region_spend", region: regionName, data: region };
    }

    case "get_cio_priorities":
      return { ok: true, action: "get_cio_priorities", data: d.cioPriority };

    case "get_leadership_options":
      return {
        ok: true,
        action: "get_leadership_options",
        data: d.opModel.itLeadershipStructure,
      };

    case "get_savings_summary":
      return { ok: true, action: "get_savings_summary", data: d.ebitdaImpact };

    case "get_roadmap":
      return { ok: true, action: "get_roadmap", data: d.roadmap };

    case "get_future_state":
      return { ok: true, action: "get_future_state", data: d.opModel.operatingModel };

    case "get_operating_model_summary":
      return { ok: true, action: "get_operating_model_summary", data: d.opModel };

    case "get_maturity":
      return { ok: true, action: "get_maturity", data: d.maturityModel };

    case "list_sections":
      return { ok: true, action: "list_sections", sections: d.navLinks.concat(d.taxonomyNavLinks) };

    default:
      return { ok: false, error: "Something went wrong. Please try rephrasing your question." };
  }
}

function formatToolResult(result) {
  if (!result.ok) {
    return result.error.includes("not find")
      ? result.error
      : "Sorry — " + stripMd(result.error);
  }

  switch (result.action) {
    case "navigate":
      return `I've scrolled to **${result.destination.label}** — you should see it on screen now.`;

    case "search": {
      if (!result.results.length) {
        return 'I searched the report but did not find a close match.\n\nTry asking about:\n• Top CIO priorities\n• How much Culligan could save\n• EMEA IT spend\n• Or say "take me to the roadmap"';
      }
      const top = result.results[0];
      const extra =
        result.results.length > 1
          ? "\n\nRelated topics: " + result.results.slice(1, 3).map((r) => r.title).join(", ") + "."
          : "";
      return firstSentence(top.content, 520) + extra;
    }

    case "get_hypothesis": {
      const topic = explainHypothesis(result.code);
      const lines = [
        `**${result.code}** looks at ${topic}.`,
        stripMd(result.legend.definition),
        `What we measured: ${stripMd(result.legend.measured)}`,
      ];
      if (result.finding) {
        lines.push(
          `The report flags this as **${result.finding.status}**.`,
          `The numbers: ${stripMd(result.finding.numbers).replace(/\n/g, " · ")}`,
          `What that means in plain terms: ${stripMd(result.finding.meaning)}`
        );
      }
      return lines.join("\n\n");
    }

    case "get_region_spend": {
      const r = result.data;
      return (
        `In **${result.region}**, IT spend is about **${r.itSpend}** (${r.itPercent} of regional vendor spend).\n\n` +
        `${stripMd(r.costExplanation)}\n\n` +
        `Business units in this region include ${r.businessUnits.slice(0, 4).join(", ")}${r.businessUnits.length > 4 ? ", and others" : ""}.`
      );
    }

    case "get_cio_priorities": {
      const p = result.data;
      return [
        "If you can only do three things, start here:",
        ...p.priorities.map(
          (item, i) =>
            `**${i + 1}. ${item.title}**\n` +
            `When: ${stripMd(item.horizon)} · Savings: ${item.savings}\n` +
            `Who leads it: ${item.owner}\n` +
            firstSentence(item.description || item.whyItMatters || "", 200)
        ),
        firstSentence(p.intro, 240),
      ].join("\n\n");
    }

    case "get_leadership_options": {
      const ld = result.data;
      const rec = ld.recommendedOption;
      const highlights = (ld.accountabilityMatrix?.rows ?? [])
        .slice(0, 4)
        .map((r) => "• " + r.function + ": Option 3 → " + r.option3 + ". " + r.whyItMatters);
      return [
        firstSentence(ld.lead, 280),
        "**Recommended: Option " + rec.number + " — " + rec.title + "** (" + rec.tagline + "). " + stripMd(rec.summary),
        highlights.length ? "Key accountability shifts:\n" + highlights.join("\n") : "",
        ld.structuralPrinciple
          ? typeof ld.structuralPrinciple === "string"
            ? stripMd(ld.structuralPrinciple)
            : stripMd(ld.structuralPrinciple.title) + " " + stripMd(ld.structuralPrinciple.body)
          : "",
      ]
        .filter(Boolean)
        .join("\n\n");
    }

    case "get_savings_summary": {
      const e = result.data;
      return (
        `The report puts confirmed annual savings at **$16–31M**, worth roughly **$160–370M** in enterprise value at typical PE multiples (10–12× EBITDA).\n\n` +
        `The operating model case sizes **$20–44M** at Year 3 run rate.\n\n` +
        `${stripMd(e.callout.text)}`
      );
    }

    case "get_roadmap": {
      return result.data.phases
        .map((ph) => `**${ph.phase}** (${ph.horizon}) — ${ph.savings}\n${ph.actions.slice(0, 3).map((a) => "• " + a).join("\n")}`)
        .join("\n\n");
    }

    case "get_future_state": {
      const om = result.data;
      return (
        `${stripMd(om.futureLead)}\n\n` +
        `Key shifts include:\n` +
        om.comparison
          .slice(0, 4)
          .map((c) => `• **${c.dimension}:** ${stripMd(c.future)}`)
          .join("\n")
      );
    }

    case "get_operating_model_summary": {
      const om = result.data;
      return `${stripMd(om.cover.hook)}\n\n${stripMd(om.executiveSummary.rows[0]?.finding || "")}`;
    }

    case "get_maturity":
      return stripMd(result.data.callout.text);

    case "list_sections":
      return (
        "You can explore these sections — ask me to **take you to** any of them:\n\n" +
        "**Executive Summary:** " +
        result.sections
          .filter((s) => s.id.startsWith("taxonomy") === false)
          .map((s) => s.label)
          .join(", ") +
        "\n\n**Operating Model:** " +
        result.sections
          .filter((s) => s.id.startsWith("taxonomy"))
          .map((s) => s.label)
          .join(", ")
      );

    default:
      return "I found something but could not summarise it clearly. Try asking in simpler words.";
  }
}

function synthesizeReply(toolRuns) {
  const navigated = toolRuns.some((t) => t.result?.action === "navigate");
  const parts = toolRuns.map((t) => formatToolResult(t.result)).filter(Boolean);

  if (!parts.length) {
    return 'I could not find a clear answer. Try "What are the top 3 CIO priorities?" or "How much does EMEA spend on IT?"';
  }

  if (parts.length === 1) {
    let reply = parts[0];
    if (navigated && !reply.toLowerCase().includes("scrolled")) {
      reply += "\n\nI've moved the page to the right section for you.";
    }
    return reply;
  }

  const intro = navigated
    ? "Here is what I found — and I have scrolled to the relevant section:"
    : "Here is what I found in the report:";

  return [intro, ...parts].join("\n\n");
}

function runLocalAgent(message) {
  const steps = planAgentSteps(message);
  const toolRuns = steps.slice(0, 4).map((step) => ({
    tool: step.tool,
    args: step.args,
    result: executeTool(step.tool, step.args),
  }));
  return synthesizeReply(toolRuns) + "\n\n" + AGENT_DISCLAIMER;
}

/* ——— UI ——— */

let agentMessages = [];

function renderAgentMarkdown(text) {
  const parts = String(text).split(/(\*\*[^*]+\*\*)/g);
  return parts
    .map((part) => {
      if (part.startsWith("**") && part.endsWith("**")) {
        return "<strong>" + esc(part.slice(2, -2)) + "</strong>";
      }
      return nl(part);
    })
    .join("");
}

function updateResetButton() {
  const btn = document.getElementById("agentReset");
  if (btn) btn.disabled = agentMessages.length <= 1;
}

function renderAgentMessages() {
  const body = document.getElementById("agentBody");
  if (!body) return;

  let html = agentMessages
    .map((msg) => {
      const cls = msg.role === "user" ? "agent-msg user" : "agent-msg bot";
      const inner = msg.role === "user" ? esc(msg.text) : renderAgentMarkdown(msg.text);
      return '<div class="' + cls + '">' + inner + "</div>";
    })
    .join("");

  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
  updateResetButton();
}

function renderAgentWelcome() {
  agentMessages = [{ role: "assistant", text: appData.agentWelcome }];
  renderAgentMessages();
}

function resetAgent() {
  renderAgentWelcome();
  const input = document.getElementById("agentInput");
  if (input) input.value = "";
  const panel = document.getElementById("agentPanel");
  if (panel) panel.classList.add("open");
}

function setAgentLoading(on) {
  const sendBtn = document.getElementById("agentSend");
  const input = document.getElementById("agentInput");
  const body = document.getElementById("agentBody");
  if (sendBtn) {
    sendBtn.disabled = on;
    sendBtn.textContent = on ? "…" : "Send";
  }
  if (input) input.disabled = on;
  const existing = document.getElementById("agentTyping");
  if (on && body && !existing) {
    body.insertAdjacentHTML(
      "beforeend",
      '<div class="agent-msg bot agent-typing" id="agentTyping"><span class="agent-typing-label">Looking that up…</span><span class="agent-dots"><span></span><span></span><span></span></span></div>'
    );
    body.scrollTop = body.scrollHeight;
  } else if (!on && existing) {
    existing.remove();
  }
}

function sendAgent(q) {
  q = (q || "").trim();
  if (!q) return;

  agentMessages.push({ role: "user", text: q });
  renderAgentMessages();
  setAgentLoading(true);

  const input = document.getElementById("agentInput");
  if (input) input.value = "";

  setTimeout(() => {
    const reply = runLocalAgent(q);
    agentMessages.push({ role: "assistant", text: reply });
    setAgentLoading(false);
    renderAgentMessages();
  }, 450);
}

function initAgent() {
  renderAgentWelcome();

  document.getElementById("agentFab").onclick = () => {
    document.getElementById("agentPanel").classList.toggle("open");
    setTimeout(() => document.getElementById("agentInput")?.focus(), 100);
  };

  document.getElementById("agentClose").onclick = () => {
    document.getElementById("agentPanel").classList.remove("open");
  };

  document.getElementById("agentReset").onclick = resetAgent;

  document.getElementById("agentSend").onclick = () => sendAgent(document.getElementById("agentInput").value);

  document.getElementById("agentInput").onkeydown = (e) => {
    if (e.key === "Enter") sendAgent(document.getElementById("agentInput").value);
  };

  document.querySelectorAll(".agent-chip").forEach((btn) => {
    btn.onclick = () => sendAgent(btn.dataset.q);
  });

  updateResetButton();
}


document.querySelectorAll(".page-tab").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
document.getElementById("siteTitle").textContent=appData.brand.heroTitle;
document.getElementById("siteMeta").textContent=appData.brand.heroMeta;
document.getElementById("siteFooter").innerHTML=esc(appData.footer.confidentiality)+" · "+esc(appData.footer.attribution)+"<br/>"+esc(appData.footer.copyright)+" "+esc(appData.footer.disclaimer)+"<br/>"+esc(appData.draft.footnote);
renderBenchmark();
renderSubnav();
initAgent();
window.addEventListener("resize",()=>{if(document.getElementById("savingsChart"))drawChart();});
</script>
